version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Routine bumps arrive as one reviewable PR; majors stay separate so a
      # breaking change is never buried in a batch.
      bun-minor-patch:
        update-types:
          - minor
          - patch
    # typescript 7 breaks `astro check` (@astrojs/check doesn't support it
    # yet) — stop Dependabot from re-proposing this major bump every week
    # until that support lands.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
